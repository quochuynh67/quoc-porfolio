    <script>
      // Remove the legacy Flutter service worker once. It otherwise keeps
      // serving an old main.dart.js and stale image assets after a deploy.
      if ('serviceWorker' in navigator && !sessionStorage.getItem('sw-reset-v4')) {
        sessionStorage.setItem('sw-reset-v4', '1');
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            return Promise.all(registrations.map(function(registration) {
              return registration.unregister();
            }));
          }),
          'caches' in window
            ? caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(key) { return caches.delete(key); }));
              })
            : Promise.resolve()
        ]).then(function() {
          if (navigator.serviceWorker.controller) window.location.reload();
        });
      }

      // The app manages URLs itself with history.pushState (see goToPage). Flutter's
      // engine asserts on popstate entries it did not create, so swallow the native
      // event here (registered first, capture phase) and re-emit it as `app-popstate`.
      window.addEventListener('popstate', function (e) {
        e.stopImmediatePropagation();
        window.dispatchEvent(new Event('app-popstate'));
      }, true);
    </script>

        self.fetchFile = self.fetchFile || self.FFmpeg.fetchFile;

<script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.querySelector('#loader');
      if (loading) {
        loading.classList.add('is-hidden');
        window.setTimeout(function() { loading.remove(); }, 280);
      }
    });
</script>
<script>
    function openBrowser() {
    // Replace this URL with the one you want to open in Safari
    var url = "https://viiv.app";

    // Check if the device is running on iOS (for Android, use 'Android' instead of 'iPhone')
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIOS) {
        // If the device is iOS, use the 'window.location.href' to navigate to the URL
        window.location.href = url;
        console.log("openBrowser iOS so open href ", url);
    } else {
        // If it's not iOS (likely Android or another platform), use 'window.open'
        window.open(url, '_system');
        console.log("openBrowser so window.open ", url);
    }
}

 function logger(message) {

</script>

#loader {
  background: #020617;
  background: radial-gradient(circle at center, #11182a 0%, #020617 62%);
  bottom: 0;
  left: 0;
  overflow: hidden;
  position: fixed;
  right: 0;
  top: 0;
  z-index: 99999;
  opacity: 1;
  transition: opacity 240ms ease, visibility 240ms ease;
  visibility: visible;
}
#loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-inner {
  bottom: 0;
  height: 132px;
  left: 0;
  margin: auto;
  position: absolute;
  right: 0;
  top: 0;
  width: 104px;
}
.loader-logo {
  display: block;
  width: 96px;
  height: 96px;
  filter: drop-shadow(0 0 18px rgba(124, 92, 255, .45));
  animation: logo-pulse 1.5s ease-in-out infinite;
}
.loader-progress {
  height: 3px;
  margin-top: 22px;
  border-radius: 99px;
  background: linear-gradient(90deg, #ff4d9d, #7c5cff, #22d3ee);
  animation: progress-pulse 1.2s ease-in-out infinite;
}
@keyframes logo-pulse { 50% { transform: translateY(-4px) scale(1.03); } }
@keyframes progress-pulse { 0%, 100% { opacity: .25; transform: scaleX(.35); } 50% { opacity: 1; transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) {
  .loader-logo, .loader-progress { animation: none; }
}
