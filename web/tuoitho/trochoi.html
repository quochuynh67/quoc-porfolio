        #box:hover,

        }

        #input {
            cursor: pointer;
            position: absolute;

            height: 100%;

        #display {
            width: 100%;

        }

        select,

            padding: 0.6em 0.4em;

            font-weight: bold;
            font-size: 16px;

            border: 1px solid #555;
            cursor: pointer;
            transition-duration: 0.2s
        }

        select:hover,
        button:hover {
            background-color: #666;
            color: #ddd
        }

        .logo {
            width: 130px;
            height: 130px;
            filter: drop-shadow(0 0 8px white);
        }
        /* ── Touch-to-Play Overlay ──────────────────────────────────────── */
        #tap-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(ellipse at center, #0d0d2b 0%, #000 70%);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #tap-overlay.visible { display: flex; }
        #tap-overlay.ready   { cursor: pointer; }

        /* Scanline */
        #tap-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent, transparent 3px,
                rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        #tap-overlay-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 30px;
            text-align: center;
        }

        /* ── Game title ── */
        #tap-game-title {
            font-family: monospace;
            font-size: clamp(18px, 4vw, 32px);
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 12px #00e5ff, 0 0 30px #00e5ff88;
            letter-spacing: 3px;
            animation: titlePulse 2s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 10px #00e5ff, 0 0 25px #00e5ff88; }
            50%       { text-shadow: 0 0 20px #00e5ff, 0 0 50px #00e5ffcc, 0 0 80px #00e5ff44; }
        }

        /* ── Loading spinner (shown while decompressing) ── */
        #tap-loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .tap-spinner {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 5px solid #1a1a3a;
            border-top-color: #00e5ff;
            border-right-color: #ff3cac;
            animation: spinRing 0.9s linear infinite;
            box-shadow: 0 0 16px #00e5ff66;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }

        .tap-loading-dots::after {
            content: '';
            animation: loadDots 1.4s steps(4, end) infinite;
        }
        @keyframes loadDots {
            0%   { content: '';    }
            25%  { content: '.';   }
            50%  { content: '..';  }
            75%  { content: '...'; }
        }
        #tap-loading-label {
            font-family: monospace;
            font-size: 15px;
            color: #aaa;
            letter-spacing: 2px;
        }

        /* ── Ready state (shown after decompression done) ── */
        #tap-ready-wrap { display: none; flex-direction: column; align-items: center; gap: 16px; }
        #tap-overlay.ready #tap-loading-wrap { display: none; }
        #tap-overlay.ready #tap-ready-wrap   { display: flex; }

        .tap-coin-ring {
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            box-shadow: 0 0 18px #ffd700, 0 0 40px #ffd70088, inset 0 0 18px #ffd70033;
            animation: ringPulse 1.2s ease-in-out infinite;
            display: flex; align-items: center; justify-content: center;
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1);    box-shadow: 0 0 18px #ffd700, 0 0 40px #ffd70088; }
            50%       { transform: scale(1.12); box-shadow: 0 0 30px #ffd700, 0 0 70px #ffd700bb; }
        }
        .tap-coin-inner { font-size: 38px; }

        #tap-cta {
            font-family: monospace;
            font-size: clamp(16px, 3.5vw, 26px);
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: blinkCTA 0.9s step-start infinite;
        }
        @keyframes blinkCTA {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        #tap-sub { font-family: monospace; font-size: 13px; color: #aaa; letter-spacing: 1px; }

        /* ── Floating stars ── */
        .tap-star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            animation: starFloat linear infinite;
        }
        @keyframes starFloat {
            0%   { transform: translateY(0)   scale(0); opacity: 0; }
            20%  { opacity: 1; }
            80%  { opacity: 0.7; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }


        #top {
            margin: 5px;
        }

            margin: auto;
            padding: 10px;
            font-size: 16px;
            background: #555;
            color: #fff;
            border: 1px solid #777;
            border-radius: 5px;

        #tap-keyhelp {
    margin-top: 8px;
    width: min(92vw, 420px);

    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;

    box-shadow:
        0 0 18px rgba(0, 229, 255, 0.10),

}

@keyframes keyHelpGlow {
    from {

    }
    to {

}

.tap-keyhelp-title {
    margin-bottom: 10px;

#tap-keyhelp-content {

.tap-key-row {

.tap-key-label {

.tap-key-value {

        // Monkey-patch getExtension TRƯỚC khi load emulator.min.js
        (function() {
          const origGetExtension = WebGLRenderingContext.prototype.getExtension;
          WebGLRenderingContext.prototype.getExtension = function(name) {
            if (name === 'WEBGL_polygon_mode') {
              // Không enable extension này -> browser sẽ không log warning
              return null;
            }
            return origGetExtension.call(this, name);
          };

    <script>
        // ── iOS detection (covers iPhone/iPad and iPadOS-as-Mac) ──────────────
        const isIOS =
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIOS) console.log("[EJS] iOS device detected – applying stability mode");

        let enableDebug = false;
        let enableThreads = false;
        let browserMode;
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);

        // Debug flag (always off on iOS to reduce memory pressure)
        if (!isIOS && (parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true")) {
            enableDebug = true;
            console.log("Debug is enabled");
        } else {
            console.log("Debug is disabled");
        }

        // Threads: disabled on iOS regardless of URL param or SharedArrayBuffer
        if (!isIOS && (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true")) {
            if (window.SharedArrayBuffer) {
                enableThreads = true;
                console.log("Threads are enabled");
            } else {
                console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
                console.log("Threads are disabled");
            }
        } else {
            if (isIOS) console.log("Threads are force-disabled on iOS.");
            else console.log("Threads are disabled");
        }

        if (urlParams.get("browserMode")) {
            browserMode = urlParams.get("browserMode");
        }

        if (urlParams.get("rom")) {
            console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
            run(false, urlParams.get("rom"));
        }


        // ── Overlay logic: show on EJS_onGameStart, tap to hide ─────────────
        function _spawnStars() {
            const ov = document.getElementById('tap-overlay');
            if (!ov) return;
            ov.querySelectorAll('.tap-star').forEach(function (s) { s.remove(); });
            for (let i = 0; i < 40; i++) {
                const s = document.createElement('div');
                s.className = 'tap-star';
                s.style.left = (Math.random() * 100) + 'vw';
                s.style.bottom = '-6px';
                s.style.animationDuration = (4 + Math.random() * 6) + 's';
                s.style.animationDelay = (Math.random() * 8) + 's';
                const sz = (1 + Math.random() * 3) + 'px';
                s.style.width = sz;
                s.style.height = sz;
                ov.appendChild(s);
            }
        }

        // Start game immediately after user selects from dropdown
        function selectGame(value) {
            const ov = document.getElementById('tap-overlay');
            if (ov) {
                ov.classList.remove('visible');
                ov.classList.remove('ready');
            }
            run(false, value);
        }

        function showTapOverlay(titleText) {
            const ov = document.getElementById('tap-overlay');
            if (!ov) return;
            const title = document.getElementById('tap-game-title');
            if (title) title.textContent = titleText || 'Game started';
            _spawnStars();
            ov.classList.add('visible');
            ov.classList.add('ready');
        }

        function disableSelectionForGameUI() {
  [
    document.body,
    document.getElementById('game'),
    document.getElementById('tap-overlay'),
    ...document.querySelectorAll('.ejs_gamepad, .ejs_gamepad *, .ejs_virtual_gamepad, .ejs_virtual_gamepad *')
  ].forEach(function(el) {
    if (!el) return;
    el.setAttribute('unselectable', 'on');
    el.setAttribute('draggable', 'false');
    el.style.webkitUserSelect = 'none';
    el.style.userSelect = 'none';
    el.style.webkitTouchCallout = 'none';
  });
}

        (function() {
            function _initOverlay() {
                const ov = document.getElementById('tap-overlay');
                if (!ov) return;
                function dismissOverlay() {
                    ov.classList.remove('visible');
                    ov.classList.remove('ready');
                }
                ov.addEventListener('click', dismissOverlay);
                ov.addEventListener('touchstart', dismissOverlay, { passive: true });
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', _initOverlay);
            } else {
                _initOverlay();
            }
        })();

        async function run(upload, file) {
            const url = upload ? input.files[0] : (file.startsWith("fb_neo_rom/") ? file : `roms/${file}`);
            const parts = upload ? input.files[0].name.split(".") : file.split("/").pop().split(".");

            const core = await (async (ext) => {
                return "fbneo";
                if (["fds", "nes", "unif", "unf"].includes(ext))
                    return "nes"

                if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                    return "snes"

                if (["z64", "n64"].includes(ext))
                    return "n64"

                if (["pce"].includes(ext))
                    return "pce"

                if (["ngp", "ngc"].includes(ext))
                    return "ngp"

                if (["ws", "wsc"].includes(ext))
                    return "ws"

                if (["col", "cv"].includes(ext))
                    return "coleco"

                if (["d64"].includes(ext))
                    return "vice_x64sc"

                if (["nds", "gba", "gb", "z64", "n64"].includes(ext))
                    return ext

                        "Nintendo Game Boy": "gb",
                        "Nintendo Game Boy Advance": "gba",
                        "Nintendo DS": "nds",

                        "Atari Lynx": "lynx",
                        "Sega 32X": "sega32x",
                        "Atari Jaguar": "jaguar",
                        "Sega Game Gear": "segaGG",
                        "Sega Saturn": "segaSaturn",
                        "Atari 7800": "atari7800",
                        "Atari 2600": "atari2600",
                        "Arcade": "arcade",
                        "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                        "NEC PC-FX": "pcfx",
                        "SNK NeoGeo Pocket (Color)": "ngp",
                        "Bandai WonderSwan (Color)": "ws",
                        "ColecoVision": "coleco",
                        "Commodore 64": "vice_x64sc",
                        "Commodore 128": "vice_x128",
                        "Commodore VIC20": "vice_xvic",
                        "Commodore Plus/4": "vice_xplus4",
                        "Commodore PET": "vice_xpet",
                        "DOSBOX-PURE": "dosbox_pure"
                    }

                    const cores = Object.keys(coreValues).sort().reduce(
                        (obj, key) => {
                            obj[key] = coreValues[key];
                            return obj;
                        },
                        {}
                    );

                    const button = document.createElement("button")
                    const select = document.createElement("select")

                    for (const type in cores) {
                        const option = document.createElement("option")

                        option.value = cores[type]
                        option.textContent = type
                        select.appendChild(option)
                    }

                    button.onclick = () => resolve(select[select.selectedIndex].value)
                    button.textContent = "Load game"
                    box.innerHTML = ""

                    box.appendChild(select)
                    box.appendChild(button)
                })
            })(parts.pop())

            const div = document.createElement("div")
            const sub = document.createElement("div")
            const script = document.createElement("script")

            sub.id = "game"
            div.id = "display"


            box.remove()
            div.appendChild(sub)
            document.body.appendChild(div)
            window.EJS_onGameStart = function (e) {
                disableSelectionForGameUI();
                console.log('[EJS] Game started', {
                    gameName: window.EJS_gameName,
                    core: window.EJS_core,
                    event: e,
                });
                showTapOverlay(window.EJS_gameName);
            };
            window.EJS_player = "#game";
            window.EJS_gameName = parts.shift();

   window.EJS_VirtualGamepadSettings = [

            async function decompress(base64) {
                const blob = new Blob([Uint8Array.from(atob(base64), (m) => m.codePointAt(0))]);
                return await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).blob();
            }
            async function decompressToBlobURL(base64, type) {
                let blob = await decompress(base64);
                blob = new Blob([blob], { type: type || "application/json" });
                return URL.createObjectURL(blob);
